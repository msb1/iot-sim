  - entity_type: "battery_cleanroom_robotic_air_lock"
    entity_id: "battery_cleanroom_airlock_02"
    description: "Production-grade robotic material air lock with correlated atmospheric, pneumatic, mechanical, and lifecycle telemetry"
    sensors:
      # One shared physical model emits the full, timestamp-aligned sensor
      # frame. Metric-specific operating ranges are documented below.
      - type: "robotic_air_lock"
        id_prefix: "mal-robotic-04-telemetry"
        quantity: 1
        timestep_ms: 1000
        # Envelope for the multi-metric transport record. Per-metric physical
        # limits remain enforced by the model configuration and tests.
        min_value: -60.0
        max_value: 500.0
        robotic_air_lock:
          air_lock_id: "MAL-ROBOTIC-04"
          # 300 seconds/cycle = 12 cycles/hour = 288 cycles/day.
          entry_duration_seconds: 45.0
          sealing_duration_seconds: 15.0
          purge_duration_seconds: 105.0
          exit_duration_seconds: 45.0
          reset_duration_seconds: 90.0
          # Atmospheric: dew point -60..0 C (normal target -40..-50 C),
          # dry-bulb 18..22 C, and RH 0..5%.
          nominal_dew_point_c: -50.0
          ambient_temperature_c: 20.2
          ambient_relative_humidity_pct: 0.45
          # Pneumatic: 15..30 Pa when sealed; dry-air/N2 flow is 0..500 CFM.
          nominal_differential_pressure_pa: 22.0
          nominal_seal_pressure_bar: 3.1
          purge_flow_rate_cfm: 350.0
          measurement_noise_sigma: 0.08
          seed: 3001

