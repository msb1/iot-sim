# IoT Simulator Configuration
config_name: "Industrial Facility Simulation v2"
schema_version: "1.0"

runtime:
  # Omit run_duration_seconds to run until Ctrl-C/SIGINT.
  shutdown_timeout_seconds: 10

# Set true while troubleshooting to print every generated reading as JSON to
# the console. Leave false for quieter normal operation.
logging:
  simulator_stream:
    enabled: true

exporters:
  prometheus:
    enabled: true
    bind: "0.0.0.0:9898"
    path: "/metrics"
  kafka:
    enabled: true
    brokers: "192.168.1.50:9092,192.168.1.50:9094,192.168.1.50:9096"
    topic: "iot.telemetry.v1"
    client_id: "iot-sim-industrial-facility"
    security:
      # Populate these directly, via an overlay file, or with IOT_SIM__... env vars later.
      security_protocol: null
      sasl_mechanism: null
      username: null
      password: null

# Physical-model operating parameters. Sensor output bounds and cadence are
# specified with each logical sensor below.
models:
  weather:
    initial_temperature_c: 22.0
    initial_pressure_hpa: 1013.25
    initial_humidity_pct: 50.0
    temperature_measurement_noise_sigma: 0.1
    temperature_drift_sigma: 0.05
    pressure_measurement_noise_sigma: 0.05
    pressure_drift_sigma: 0.2
    humidity_noise_sigma: 0.5
    storm_transition_rate: 0.25
    storm_temperature_drop_c: 7.0
    storm_pressure_drop_hpa: 30.0
    storm_humidity_rise_pct: 35.0
    diurnal_temperature_amplitude_c: 6.0
    pressure_tide_amplitude_hpa: 1.5
    storm_temperature_noise_multiplier: 2.0
    storm_humidity_noise_multiplier: 1.5
    storm_pressure_noise_multiplier: 4.0
    storm_diurnal_amplitude_reduction_c: 1.0
    temperature_cycle_phase_hour: 6.0
    temperature_humidity_coupling: 4.0
    storm_pressure_tide_reduction_hpa: 0.5
    pressure_tides_per_day: 2.0

  sound:
    ambient_floor_db: 45.0
    noise_sigma: 1.2
    spike_probability_per_sample: 0.15
    decay_rate: 3.0
    spike_min_db: 65.0
    spike_max_db: 85.0
    spike_cutoff_db: 1.0

  electrical:
    nominal_voltage_v: 230.0
    grid_impedance_ohm: 0.08
    trip_threshold_amps: 65.0
    phase_impedance_ohm: [5.0, 5.0, 4.8]
    base_power_factor: [0.92, 0.91, 0.86]
    background_voltage_thd_pct: 1.5
    polluted_voltage_thd_pct: 8.2
    fault_impedance_ohm: 2.1
    voltage_noise_sigma: 0.3
    current_noise_sigma: 0.1
    power_factor_noise_sigma: 0.003
    thd_noise_sigma: 0.12
    current_thd_divisor_amps: 10.0
    current_thd_multiplier: 0.4
    thd_power_factor_penalty: 0.02

  ph:
    target_mean: 7.2
    measurement_noise_sigma: 0.05
    drift_sigma: 0.01
  orp:
    target_mean: 250.0
    measurement_noise_sigma: 2.5
    drift_sigma: 0.5
  conductivity:
    target_mean: 1.4
    measurement_noise_sigma: 0.02
    drift_sigma: 0.005

  process:
    initial_concentration_mol_l: 0.2
    target_equilibrium_mol_l: 0.2
    reversion_rate: 0.15
    optical_path_length_cm: 1.0
    molar_extinction: [0.05, 1.45, 2.10, 0.12]
    optical_noise_sigma: 0.004
    optical_drift_sigma: 0.0005
    concentration_noise_sigma: 0.015

  gas:
    initial_temperature_c: 22.0
    initial_humidity_pct: 50.0
    baseline_co_ppm: 0.0
    baseline_lel_pct: 0.0
    baseline_voc_ppm: 0.1
    hazard_co_ppm: 45.0
    hazard_lel_pct: 12.4
    hazard_voc_ppm: 85.0
    safety_noise_sigma: 0.05
    degradation_drift_sigma: 0.001
    co_warning_ppm: 35.0
    lel_warning_pct: 10.0
    humidity_quenching_per_pct: 0.005
    humidity_quenching_threshold_pct: 50.0
    dissolved_oxygen_saturation_coefficients: [14.621, -0.449, 0.0057]
    dissolved_oxygen_noise_multiplier: 0.4
    co_noise_multiplier: 2.0
    lel_noise_multiplier: 0.3
    voc_noise_multiplier: 0.1
    ventilation_poisoning_retention: 0.95

  hydraulics:
    max_capacity_liters: 1000.0
    initial_fill_pct: 50.0
    fluid_density_kg_l: 1.20
    tank_tare_weight_kg: 450.0
    base_inflow_l_min: 45.0
    base_outflow_l_min: 45.0
    high_discharge_l_min: 95.0
    mixer_rpm: 120.0
    mixer_harmonic_amplitude_kg: 8.5
    level_noise_sigma: 0.15
    flow_noise_sigma: 0.4
    load_cell_noise_sigma: 0.25
    mixer_start_after_seconds: 4.0
    high_discharge_after_seconds: 9.0

entities:
  - entity_type: "weather_station"
    entity_id: "facility_weather_station_01"
    description: "Outdoor facility weather and acoustic monitoring station"
    sensors:
      - type: "weather"
        id_prefix: "weather-01"
        quantity: 1
        timestep_ms: 5000
        min_value: -100.0
        max_value: 2000.0
      - type: "sound"
        id_prefix: "sound-01"
        quantity: 1
        timestep_ms: 1000
        min_value: 30.0
        max_value: 120.0

  - entity_type: "machinery"
    entity_id: "cnc_milling_machine_01"
    description: "Primary CNC milling station on the factory floor"
    sensors:
      - type: "electrical"
        id_prefix: "elec-01"
        quantity: 1
        timestep_ms: 1000
        min_value: 0.0
        max_value: 1000000000.0

  - entity_type: "water_treatment_skid"
    entity_id: "water_quality_skid_01"
    description: "Electrochemical water-quality analyzer skid"
    sensors:
      - type: "ph"
        id_prefix: "ph-01"
        quantity: 1
        timestep_ms: 2000
        min_value: 0.0
        max_value: 14.0
      - type: "orp"
        id_prefix: "orp-01"
        quantity: 1
        timestep_ms: 3000
        min_value: -500.0
        max_value: 800.0
      - type: "conductivity"
        id_prefix: "cond-01"
        quantity: 1
        timestep_ms: 2500
        min_value: 0.0
        max_value: 5.0

  - entity_type: "chemical_reactor"
    entity_id: "batch_reactor_01"
    description: "Batch reactor with process analytics and gas safety instrumentation"
    sensors:
      - type: "chemical_concentration"
        id_prefix: "chem-01"
        quantity: 1
        timestep_ms: 1500
        min_value: 0.0
        max_value: 10.0
      - type: "process_analytics_ftir"
        id_prefix: "spec-01"
        quantity: 1
        timestep_ms: 4000
        min_value: 0.0
        max_value: 10.0
      - type: "dissolved_oxygen"
        id_prefix: "do-01"
        quantity: 1
        timestep_ms: 3000
        min_value: 0.0
        max_value: 25.0
      - type: "toxic_gas"
        id_prefix: "gas-toxic-01"
        quantity: 1
        timestep_ms: 1000
        min_value: 0.0
        max_value: 1000.0
      - type: "combustible_gas"
        id_prefix: "gas-comb-01"
        quantity: 1
        timestep_ms: 1000
        min_value: 0.0
        max_value: 100.0
      - type: "photoionization"
        id_prefix: "voc-01"
        quantity: 1
        timestep_ms: 2000
        min_value: 0.0
        max_value: 10000.0

  - entity_type: "process_tank"
    entity_id: "mixing_tank_01"
    description: "Coupled storage, discharge, and mixing tank"
    sensors:
      - type: "level"
        id_prefix: "level-01"
        quantity: 1
        timestep_ms: 2000
        min_value: 0.0
        max_value: 1000.0
      - type: "mass_flow"
        id_prefix: "flow-01"
        quantity: 1
        timestep_ms: 1000
        min_value: 0.0
        max_value: 500.0
      - type: "load_cell"
        id_prefix: "load-01"
        quantity: 1
        timestep_ms: 2500
        min_value: 0.0
        max_value: 5000.0
