config_name: "Battery dry-room robotic material air-lock simulation"
schema_version: "1.0"

runtime:
  shutdown_timeout_seconds: 10
  run_duration_seconds: 600

logging:
  simulator_stream:
    enabled: false

exporters:
  prometheus:
    enabled: false
    bind: "0.0.0.0:9898"
    path: "/metrics"
  kafka:
    enabled: false
    brokers: "192.168.1.50:9092,192.168.1.50:9094,192.168.1.50:9096"
    topic: "iot.telemetry.v1"
    client_id: "iot-sim-industrial-scenarios"
    security: { security_protocol: null, sasl_mechanism: null, username: null, password: null }
  # Dataset mode is finite and exclusive with Kafka and Prometheus. Copy this
  # configuration, disable both streaming exporters above, and select the
  # historical start instant when generating a Parquet dataset.
  dataset:
    enabled: true
    start_time: "2026-01-01T00:00:00Z"
    s3_endpoint_url: "http://192.168.1.50:9000"
    s3_bucket_name: "iotsim"
    s3_access_key: "access"
    s3_secret_key: "secret"

anomalies:
  enabled: true
  seed: 42
  profiles:
    # Model-level strategies are applied before the air-lock computes its
    # coupled frame; they are never post-sample mutations of one metric.
    - name: "robotic_air_lock_blown_seal"
      enabled: true
      type: "robotic_air_lock_seal_failure"
      target: { sensor_id: "mal-robotic-04-telemetry", metric: "equipment_state_code" }
      # About one event per 45 days at 12 cycles/hour (roughly six events in
      # nine months; one event every 1–2 months).
      trigger: { threshold: 0.9999228, start_after_cycles: 0 }
      faulted_cycles_before_maintenance: 3
      maintenance_cycles: 1
    - name: "robotic_air_lock_wet_payload"
      enabled: true
      type: "robotic_air_lock_wet_payload"
      target: { sensor_id: "mal-robotic-04-telemetry", metric: "dew_point_c" }
      # About three events per week at 12 cycles/hour (3 / 2,016 cycles).
      trigger: { threshold: 0.9985119, start_after_cycles: 0 }
      duration_cycles: 1
      recovery_multiplier: 3.0
