[package]
name = "iot-sim"
version = "0.1.0"
edition = "2021"

[features]
# The checked-in simulation configuration enables Kafka, so keep the producer
# in the normal binary built by `cargo run`.
default = ["kafka"]
kafka = ["dep:rdkafka"]

[dependencies]
async-trait = "0.1"
axum = "0.8"
config = { version = "0.15", default-features = false, features = ["yaml"] }
prometheus = "0.14"
rand = "0.8"
rand_distr = "0.4"
rdkafka = { version = "0.38", features = ["dynamic-linking", "tokio"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
